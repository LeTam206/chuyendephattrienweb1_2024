<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 2</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome 6.6.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- My style -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="product-detail m-auto p-4">
        <div class="price fw-bold fs-5">$15.00 - $20.00</div>
        <div class="name fw-bold">Natural Coconut Cleansing Oil</div>
        <div class="star d-flex align-items-center mt-3">
            <i class="fa-solid fa-star text-success"></i>
            <i class="fa-solid fa-star text-success"></i>
            <i class="fa-solid fa-star text-success"></i>
            <i class="fa-solid fa-star text-success"></i>
            <i class="fa-solid fa-star text-success"></i>
            <span class="mx-2">|</span>
            <div class="mount-customer-review text-secondary">(1 customer review)</div>
        </div>
        <p class="status-product text-secondary mt-3">This is a variable product.</p>
        <div class="color d-flex align-items-center">
            <span class="me-3 fw-bold me-4">Color</span>
            <select class="form-select" aria-label="Default select example">
                <option selected>Choose an option</option>
                <option value="1">Red</option>
                <option value="2">Green</option>
                <option value="3">Yellow</option>
            </select>
        </div>
        <div class="size d-flex align-items-center mt-3">
            <span class="me-3 fw-bold me-4">Size</span>
            <select class="form-select" aria-label="Default select example">
                <option selected>Choose an option</option>
                <option value="1">27</option>
                <option value="2">28</option>
                <option value="3">29</option>
            </select>
        </div>
        <div class="add-to-cart mt-4">
            <span class="fw-bold">Quantity</span>
            <div class="d-flex mt-3">
                <div class="input-group w-25 me-3 w-100">
                    <button class="input-group-text btn btn-light fw-bold btn-decrease">-</button>
                    <input type="number" value="1" class="numberInput form-control text-center bg-light border-0 fw-bold">
                    <button class="input-group-text btn btn-light fw-bold btn-increase">+</button>
                </div>
                <button class="btn btn-dark px-5 py-3 rounded-0 w-100">Add To Cart</button>
            </div>
        </div>
        <div class="actions my-4 d-flex gap-5">
            <button class="btn p-0 border-0 fw-bold">
                <i class="fa-regular fa-star me-1"></i>
                Add to wishlist
            </button>
            <button class="btn p-0 border-0 fw-bold">
                <i class="fa-solid fa-arrow-right-arrow-left me-1"></i>
                Compare
            </button>
        </div>
        <div class="other-info d-flex border-top pt-4">
            <div class="name-info fw-bold me-5">
                <div>SKU:</div>
                <div class="mt-1">Category:</div>
                <div class="mt-1">Tags:</div>
                <div class="mt-1">Share:</div>
            </div>
            <div class="detail-info">
                <div class="text-secondary">woo-vneck-tee</div>
                <div class="text-secondary mt-1">Bodycare</div>
                <div class="text-secondary mt-1">Cleaning. Coffee Bean. Eye Cream</div>
                <div class="text-secondary mt-2 d-flex">
                    <i class="fa-brands fa-facebook-f me-4"></i>
                    <i class="fa-brands fa-twitter me-4"></i>
                    <i class="fa-brands fa-linkedin-in me-4"></i>
                    <i class="fa-brands fa-tumblr me-4"></i>
                    <i class="fa-brands fa-pinterest-p"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        const decreaseButton = document.querySelector('.btn-decrease');
        const increaseButton = document.querySelector('.btn-increase');
        const numberInput = document.querySelector('.numberInput');

        checkBtnDecrease();

        // Nút giảm số lượng
        decreaseButton.addEventListener('click', () => {
            let currentValue = parseInt(numberInput.value);
            if (!isNaN(currentValue)) {
                numberInput.value = currentValue - 1;
            }
            checkBtnDecrease();

        });

        // Nút tăng số lượng
        increaseButton.addEventListener('click', () => {
            let currentValue = parseInt(numberInput.value);
            if (!isNaN(currentValue)) {
                numberInput.value = currentValue + 1;
            }
            else {
                numberInput.value = 1;
            }
            checkBtnDecrease();
        });

        function checkBtnDecrease() {
            if (parseInt(numberInput.value) == 1) {
                decreaseButton.disabled = true;
            }
            else{
                decreaseButton.disabled = false;
            }
        }
    </script>
</body>

</html>
